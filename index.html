<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据集加工平台 - Data Processing Platform</title>
  <link rel="stylesheet" href="css/dpp.css">
</head>
<body>
  <div class="app-layout">
    <!-- Header: logo + 顶部一级菜单 + 右侧工具 -->
    <header class="app-header">
      <div class="header-logo" onclick="DPP.navigate('dashboard')" data-od-id="header-logo">
        <div class="header-logo-icon">D</div>
        <span class="header-logo-text">数据集加工平台</span>
      </div>
      <nav class="topnav" id="topnav" data-od-id="topnav">
        <!-- 一级菜单由 JS 渲染 -->
      </nav>
      <div class="header-right">
        <div class="tenant-switch">
          <div class="tenant-trigger" id="tenant-trigger" onclick="DPP.toggleTenantDropdown()" data-od-id="tenant-switcher">
            <span class="tenant-logo" id="current-tenant-logo">青</span>
            <span class="tenant-name" id="current-tenant-name">青阳市运营租户</span>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6l4 4 4-4"/></svg>
          </div>
          <div class="tenant-dropdown" id="tenant-dropdown">
            <!-- 租户选项由 JS 渲染 -->
          </div>
        </div>
        <button class="header-icon-btn" title="搜索">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="7" cy="7" r="4.5"/>
            <path d="M11 11l3 3"/>
          </svg>
        </button>
        <button class="header-icon-btn" title="消息中心">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 13a1.5 1.5 0 001.5-1.5h-3A1.5 1.5 0 008 13z"/>
            <path d="M12 10V7a4 4 0 10-8 0v3L3 11h10L12 10z"/>
          </svg>
          <span class="badge-dot">99+</span>
        </button>
        <button class="header-icon-btn" title="系统设置" onclick="DPP.navigate('settings')">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="8" r="2"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M13 3l-1.4 1.4M4.4 11.6L3 13"/>
          </svg>
        </button>
        <div class="header-user">
          <div class="user-avatar">管</div>
          <span class="user-name">管理员</span>
        </div>
      </div>
    </header>

    <div class="app-body">
      <!-- Sidebar: 当前一级菜单下的二级菜单 -->
      <aside class="app-sidebar" id="app-sidebar">
        <nav class="sidebar-nav">
          <!-- Menu items rendered by JS -->
        </nav>
        <div class="sidebar-collapse" onclick="DPP.toggleSidebar()" title="收起/展开侧边栏" data-od-id="sidebar-collapse">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 8h10M3 4h10M3 12h10"/>
          </svg>
          <span class="nav-text">收起导航</span>
        </div>
      </aside>

      <!-- Main -->
      <div class="app-main">
        <div class="app-breadcrumb">
          <div class="breadcrumb">
            <span class="breadcrumb-current">工作台</span>
          </div>
        </div>
        <main class="app-content" id="page-content" style="transition: opacity .2s ease, transform .2s ease;">
          <!-- Page content rendered by JS -->
        </main>
      </div>
    </div>
  </div>

  <!-- Global Modal -->
  <div class="modal-mask" id="global-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">标题</span>
        <button class="modal-close" onclick="DPP.closeModal()">×</button>
      </div>
      <div class="modal-body"></div>
      <div class="modal-footer">
        <button class="btn" onclick="DPP.closeModal()">取消</button>
        <button class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/pages-part1.js"></script>
  <script src="js/pages-part2.js"></script>
  <script src="js/pages-part3.js"></script>
  <script src="js/pages-part4.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      DPP.init();
    });
  </script>
</body>
</html>
